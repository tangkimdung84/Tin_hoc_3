
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    💻 Thế giới Tin học 3

        ← Trang chủ
    </a>

            <div class="quiz-user">

    <!-- MAIN -->

        <section class="quiz-lesson-section">

                <p>Em hãy chọn một bài học mình muốn chinh phục.</p>

            <div id="quizResultContent">

                <!-- Kết quả sẽ được hiển thị tại đây -->

            </div>

    <!-- FOOTER -->
    <footer class="quiz-footer">
        <p>🌟 Học vui - Khám phá - Chinh phục kiến thức!</p>
    </footer>
